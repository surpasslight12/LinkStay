# LinkStay service configuration.
#
# Installed as /etc/linkstay.conf and read by linkstay.service through
# EnvironmentFile=. Every line is optional; uncomment and edit as needed.
# Duration values require a lowercase s or ms suffix. timeout must be smaller
# than interval. Poweroff=true requires a systemd host.

#LINKSTAY_TARGET=1.1.1.1
#LINKSTAY_INTERVAL=10s
#LINKSTAY_THRESHOLD=5
#LINKSTAY_TIMEOUT=3000ms
#LINKSTAY_POWEROFF=true
#LINKSTAY_LOG_LEVEL=info
