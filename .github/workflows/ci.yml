name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy shellcheck
      - name: Build, test, lint, and sanitize
        run: make check
